name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acessolivre_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/acessolivre_test?schema=public
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/acessolivre_test?schema=public
      JWT_SECRET: segredo-de-ci-com-mais-de-16-caracteres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @acessolivre/api exec prisma generate
      - name: Tipos
        run: pnpm --filter @acessolivre/shared --filter @acessolivre/api typecheck
      - name: Testes do pacote compartilhado (selo)
        run: pnpm --filter @acessolivre/shared test
      - name: Testes da API
        run: pnpm --filter @acessolivre/api test
      - name: Build da API
        run: pnpm --filter @acessolivre/api build
      - name: Tipos do app
        run: pnpm --filter @acessolivre/mobile typecheck
      - name: Testes do app (componentes e acessibilidade)
        run: pnpm --filter @acessolivre/mobile test --ci
